#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true

#https://youtrack.jetbrains.com/issue/KT-82395
kotlin.incremental.js=false
kotlin.incremental.js.klib=false

#Android
android.useAndroidX=true
# AGP 9 enables built-in Kotlin and the new KMP Android DSL by default.
# These flags keep `com.android.library` + `androidTarget {}` and the
# `kotlin-android` plugin on :sample:androidApp working until that migration.
android.builtInKotlin=false
android.newDsl=false

#Publishing (overridden in CI by the RELEASE_VERSION env var)
libraryVersion=1.0.4
